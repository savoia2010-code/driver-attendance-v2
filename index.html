<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ドライバー勤怠管理</title>
  <!-- 機密情報は config.js から読み込む（.gitignore 済み） -->
  <script src="config.js"></script>
  <style>
    /* ============================================================
       リセット・基本設定
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --surface2:  #334155;
      --border:    #475569;
      --text:      #f1f5f9;
      --text2:     #94a3b8;
      --accent:    #3b82f6;
      --accent-dk: #1d4ed8;
      --success:   #16a34a;
      --danger:    #dc2626;
      --warning:   #d97706;
      --radius:    12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ============================================================
       画面切り替え
       ============================================================ */
    .screen { display: none; flex-direction: column; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ============================================================
       共通: ヘッダー
       ============================================================ */
    .page-header {
      background: var(--surface);
      padding: 24px 20px 18px;
      border-bottom: 2px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .page-header h1 {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .page-header p {
      font-size: 16px;
      color: var(--text2);
      margin-top: 4px;
    }

    /* ============================================================
       共通: コンテンツエリア
       ============================================================ */
    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ============================================================
       共通: フッター
       ============================================================ */
    .page-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      text-align: center;
    }

    /* ============================================================
       共通: ボタン
       ============================================================ */
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border: none;
      border-radius: var(--radius);
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      min-height: 52px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary   { background: var(--accent);   color: #fff; width: 100%; }
    .btn-secondary { background: var(--surface2); color: var(--text); width: 100%; }
    .btn-danger    { background: var(--danger);   color: #fff; width: 100%; }
    .btn-ghost     { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    .btn:disabled  { opacity: 0.4; cursor: not-allowed; }

    /* ============================================================
       共通: トースト通知
       ============================================================ */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      color: var(--text);
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 16px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 500;
      border: 1px solid var(--border);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error { background: #7f1d1d; border-color: var(--danger); }

    /* ============================================================
       共通: 確認モーダル
       ============================================================ */
    #confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #confirm-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    #confirm-sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 40px;
      width: 100%;
      transform: translateY(40px);
      transition: transform 0.25s;
    }
    #confirm-overlay.open #confirm-sheet {
      transform: translateY(0);
    }
    #confirm-title {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }
    #confirm-body {
      font-size: 16px;
      color: var(--text2);
      text-align: center;
      margin-bottom: 24px;
    }
    #confirm-ok   { margin-bottom: 12px; }

    /* ============================================================
       共通: ローディングオーバーレイ
       ============================================================ */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #loading-overlay.show { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { font-size: 18px; color: var(--text2); }

    /* ============================================================
       画面1: ドライバー選択
       ============================================================ */
    .driver-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 20px 24px;
      margin-bottom: 14px;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 22px;
      font-weight: bold;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      min-height: 72px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .driver-btn:hover  { background: var(--accent-dk); border-color: var(--accent); }
    .driver-btn:active { transform: scale(0.97); background: var(--accent-dk); }

    .error-box {
      background: #450a0a;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 20px;
      color: #fca5a5;
      text-align: center;
      font-size: 18px;
    }
    .error-box small {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      color: #f87171;
    }
    .error-box .btn { margin-top: 16px; width: auto; }

    .loading-txt {
      text-align: center;
      padding: 48px 0;
      color: var(--text2);
      font-size: 18px;
    }

    /* ============================================================
       画面2〜5: 準備中プレースホルダー
       ============================================================ */
    .placeholder-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text2);
      font-size: 20px;
      padding: 40px;
      text-align: center;
    }
    .placeholder-box .back-btn {
      margin-top: 24px;
      padding: 14px 32px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ============================================================
     共通UI
     ============================================================ -->
<div id="toast"></div>

<div id="confirm-overlay">
  <div id="confirm-sheet">
    <div id="confirm-title"></div>
    <div id="confirm-body"></div>
    <button id="confirm-ok"     class="btn btn-danger">実行する</button>
    <button id="confirm-cancel" class="btn btn-secondary" onclick="closeConfirm()">キャンセル</button>
  </div>
</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-msg">読み込み中...</div>
</div>

<!-- ============================================================
     画面1: ドライバー選択
     ============================================================ -->
<div id="screen-select" class="screen active">
  <div class="page-header">
    <h1>勤怠管理</h1>
    <p>ドライバーを選択してください</p>
  </div>
  <div class="content">
    <div id="driver-list">
      <div class="loading-txt">読み込み中...</div>
    </div>
  </div>
  <div class="page-footer">
    <button class="btn btn-ghost" onclick="goAdminLogin()" style="width:auto;font-size:16px;padding:12px 28px;">
      管理者
    </button>
  </div>
</div>

<!-- ============================================================
     画面2: パスワード入力（PHASE 2以降で実装）
     ============================================================ -->
<div id="screen-password" class="screen">
  <div class="page-header">
    <h1>パスワード入力</h1>
  </div>
  <div class="placeholder-box">
    <div>この画面は次のフェーズで実装します</div>
    <button class="back-btn" onclick="showScreen('screen-select')">もどる</button>
  </div>
</div>

<!-- ============================================================
     画面3: メイン打刻画面（PHASE 2以降で実装）
     ============================================================ -->
<div id="screen-main" class="screen">
  <div class="page-header">
    <h1>打刻</h1>
  </div>
  <div class="placeholder-box">
    <div>この画面は次のフェーズで実装します</div>
    <button class="back-btn" onclick="showScreen('screen-select')">もどる</button>
  </div>
</div>

<!-- ============================================================
     画面4: 日報入力（PHASE 2以降で実装）
     ============================================================ -->
<div id="screen-report" class="screen">
  <div class="page-header">
    <h1>日報入力</h1>
  </div>
  <div class="placeholder-box">
    <div>この画面は次のフェーズで実装します</div>
    <button class="back-btn" onclick="showScreen('screen-select')">もどる</button>
  </div>
</div>

<!-- ============================================================
     画面5: 管理者（PHASE 2以降で実装）
     ============================================================ -->
<div id="screen-admin" class="screen">
  <div class="page-header">
    <h1>管理者</h1>
  </div>
  <div class="placeholder-box">
    <div>この画面は次のフェーズで実装します</div>
    <button class="back-btn" onclick="showScreen('screen-select')">もどる</button>
  </div>
</div>

<!-- ============================================================
     JavaScript
     ============================================================ -->
<script>
// ============================================================
// アプリ状態
// ============================================================
const state = {
  drivers:       [],
  currentDriver: null,
};

// ============================================================
// 画面遷移
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ============================================================
// トースト通知
// ============================================================
let _toastTimer = null;
function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  if (_toastTimer) clearTimeout(_toastTimer);
  el.textContent = msg;
  el.className   = 'show' + (isError ? ' error' : '');
  _toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ============================================================
// 確認モーダル
// ============================================================
function openConfirm(title, body, onOk) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent  = body;
  const overlay = document.getElementById('confirm-overlay');
  overlay.classList.add('open');
  const btn = document.getElementById('confirm-ok');
  btn.onclick = () => { closeConfirm(); onOk(); };
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
}

// ============================================================
// ローディング
// ============================================================
function showLoading(msg = '処理中...') {
  document.getElementById('loading-msg').textContent = msg;
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.remove('show');
}

// ============================================================
// GAS / モックAPI 通信
// ============================================================
async function gasPost(action, params = {}) {
  const res = await fetch(CONFIG.GAS_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ action, ...params })
  });
  if (!res.ok) throw new Error('通信エラー: ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// ============================================================
// 画面1: ドライバー選択
// ============================================================
async function loadDrivers() {
  const list = document.getElementById('driver-list');
  list.innerHTML = '<div class="loading-txt">読み込み中...</div>';

  try {
    const res    = await gasPost('getDrivers');
    state.drivers = res.drivers || [];

    if (state.drivers.length === 0) {
      list.innerHTML = '<div class="error-box">ドライバーが登録されていません</div>';
      return;
    }

    list.innerHTML = state.drivers.map(d =>
      `<button class="driver-btn" onclick="selectDriver('${d.id}')">
        ${d.name}
      </button>`
    ).join('');

  } catch (err) {
    list.innerHTML = `
      <div class="error-box">
        読み込みに失敗しました
        <small>${err.message}</small>
        <button class="btn btn-secondary" onclick="loadDrivers()" style="margin-top:16px;">
          再読み込み
        </button>
      </div>`;
  }
}

function selectDriver(driverId) {
  state.currentDriver = state.drivers.find(d => d.id === driverId) || null;
  if (!state.currentDriver) return;
  // 画面2（パスワード入力）へ
  showScreen('screen-password');
}

function goAdminLogin() {
  // 画面5（管理者）へ
  showScreen('screen-admin');
}

// ============================================================
// 初期化
// ============================================================
async function init() {
  await loadDrivers();
}

init();
</script>
</body>
</html>
