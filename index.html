<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>配送ドライバー出退勤管理</title>
  <!-- GAS URLは config.js の CONFIG.GAS_URL から読み込む（.gitignore済み） -->
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   リセット・変数
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f0f0f;
  --surface:  #1a1a1a;
  --surface2: #242424;
  --border:   #2e2e2e;
  --accent:   #fb923c;
  --danger:   #ef4444;
  --success:  #22c55e;
  --info:     #3b82f6;
  --text:     #f0f0f0;
  --text2:    #b8b8b8;
  --text3:    #909090;
  --night:    #818cf8;
  --holiday:  #f43f5e;
  --overtime: #facc15;
  --radius:   14px;
  --radius-sm: 8px;
  --nav-h:    60px;
}

html, body {
  height: 100%;
  font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}

/* ============================================================
   画面管理
   ============================================================ */
.screen {
  display: none;
  flex-direction: column;
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.screen.active { display: flex; }

/* 管理者キー画面はナビなし */
.screen-fullpage {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 40px 24px;
}
.screen-fullpage.active { display: flex; }

/* ============================================================
   ヘッダー
   ============================================================ */
.header {
  padding: 52px 20px 14px;
  background: linear-gradient(180deg, #0a0a0a 0%, var(--bg) 100%);
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 3px;
  color: var(--accent);
  line-height: 1;
}
.driver-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  max-width: 160px;
  overflow: hidden;
}
.driver-badge-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.driver-badge-arrow { font-size: 10px; flex-shrink: 0; }

/* ============================================================
   コンテンツエリア
   ============================================================ */
.content {
  flex: 1;
  padding: 16px 20px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ============================================================
   ボトムナビゲーション
   ============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 4px;
  color: var(--text3);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: color 0.2s;
  min-width: 0;
}
.nav-btn:active { opacity: 0.7; }
.nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 20px; line-height: 1; }
.nav-label { font-size: 11px; font-family: 'Noto Sans JP', sans-serif; }

/* ============================================================
   共通ボタン
   ============================================================ */
.btn {
  display: inline-block;
  padding: 13px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.08s;
  user-select: none;
  -webkit-user-select: none;
}
.btn:active { transform: scale(0.96); }
.btn-full { width: 100%; display: block; text-align: center; }
.btn-primary  { background: var(--accent);   color: #fff; }
.btn-success  { background: var(--success);  color: #fff; }
.btn-danger   { background: var(--danger);   color: #fff; }
.btn-ghost    { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ============================================================
   トースト通知
   ============================================================ */
#toast {
  position: fixed;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--surface2);
  color: var(--text);
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 14px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 600;
  border: 1px solid var(--border);
  max-width: calc(100vw - 40px);
  text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: #3b0a0a; border-color: var(--danger); color: #fca5a5; }

/* ============================================================
   確認ダイアログ
   ============================================================ */
#confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 400;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
#confirm-overlay.open { opacity: 1; pointer-events: auto; }
#confirm-sheet {
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
  width: 100%;
  transform: translateY(40px);
  transition: transform 0.25s;
}
#confirm-overlay.open #confirm-sheet { transform: translateY(0); }
#confirm-title {
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
}
#confirm-body {
  font-size: 14px;
  color: var(--text2);
  text-align: center;
  margin-bottom: 24px;
  white-space: pre-wrap;
  line-height: 1.7;
}
.confirm-btn {
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 10px;
}
.confirm-btn.danger   { background: var(--danger);   color: #fff; }
.confirm-btn.primary  { background: var(--accent);   color: #fff; }
.confirm-btn.ghost    { background: var(--surface2); color: var(--text2); }

/* ============================================================
   ローディングオーバーレイ
   ============================================================ */
#loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
#loading-overlay.show { opacity: 1; pointer-events: auto; }
.spinner {
  width: 44px;
  height: 44px;
  border: 3px solid var(--surface2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-msg { font-size: 15px; color: var(--text2); }

/* ============================================================
   シートモーダル（共通）
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  touch-action: none;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-sheet {
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  width: 100%;
  transform: translateY(30px);
  transition: transform 0.25s;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-title {
  font-size: 17px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 20px;
}

/* ============================================================
   フォーム部品（共通）
   ============================================================ */
.form-group { margin-bottom: 16px; }
.form-group:last-child { margin-bottom: 0; }
.form-label {
  display: block;
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 6px;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 16px;
  padding: 11px 14px;
  font-family: inherit;
  appearance: none;
  -webkit-appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.form-input[readonly] { color: var(--text3); background: var(--bg); }
.form-textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* チップ選択（アルコールチェック用）*/
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 7px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  font-size: 14px;
  font-family: inherit;
  background: none;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.active-success { background: var(--success); border-color: var(--success); color: #fff; }
.chip.active-danger  { background: var(--danger);  border-color: var(--danger);  color: #fff; }
.chip.active-info    { background: var(--info);    border-color: var(--info);    color: #fff; }

/* セクションタイトル */
.section-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* カード */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}

/* トグルスイッチ */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.toggle-switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
.toggle-switch input { display: none; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.toggle-slider::after {
  content: '';
  position: absolute;
  left: 3px; top: 3px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--text3);
  transition: transform 0.2s, background 0.2s;
}
.toggle-switch input:checked + .toggle-slider { background: var(--success); border-color: var(--success); }
.toggle-switch input:checked + .toggle-slider::after { transform: translateX(20px); background: #fff; }

/* ============================================================
   打刻ボタン（大型グラデーション）
   ============================================================ */
.punch-btn {
  border: none;
  border-radius: var(--radius);
  padding: 20px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  transition: transform 0.1s, opacity 0.2s;
  user-select: none;
  -webkit-user-select: none;
}
.punch-btn:active { transform: scale(0.96); }
.punch-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.punch-icon  { font-size: 52px; line-height: 1; }
.punch-label { font-size: 30px; font-weight: 700; color: #fff; }
.punch-sub   { font-size: 11px; color: rgba(255,255,255,0.65); }
.punch-btn.start       { background: linear-gradient(135deg, #15803d, #22c55e); }
.punch-btn.end         { background: linear-gradient(135deg, #b91c1c, #ef4444); }
.punch-btn.break-start { background: linear-gradient(135deg, #1d4ed8, #3b82f6); }
.punch-btn.break-end   { background: linear-gradient(135deg, #6d28d9, #a78bfa); }

/* ============================================================
   記録カード
   ============================================================ */
.record-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  position: relative;
}
.record-date { font-size: 13px; color: var(--text3); margin-bottom: 6px; }
.record-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  color: var(--text);
  margin-bottom: 8px;
}
.hour-chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  margin-right: 6px;
  margin-bottom: 4px;
}
.hour-chip.normal    { background: rgba(240,240,240,0.12); color: var(--text2); }
.hour-chip.over      { background: rgba(250,204,21,0.15);  color: var(--overtime); }
.hour-chip.night-h   { background: rgba(129,140,248,0.15); color: var(--night); }
.hour-chip.hol       { background: rgba(244,63,94,0.15);   color: var(--holiday); }
.hour-chip.drive     { background: rgba(34,197,94,0.12);   color: var(--success); }
.hour-chip.break-h   { background: rgba(59,130,246,0.12);  color: var(--info); }
.rec-actions { display: flex; gap: 8px; margin-top: 12px; }
.rec-action-btn {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  background: none;
  border: 1px solid rgba(251,146,60,0.4);
  border-radius: var(--radius-sm);
  padding: 5px 14px;
  cursor: pointer;
  font-family: inherit;
  line-height: 1;
}
.rec-action-btn.print { color: var(--text2); border-color: var(--border); background: var(--surface2); }

/* ============================================================
   期間セレクター
   ============================================================ */
.period-selector {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.period-label {
  flex: 1;
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.period-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  font-size: 18px;
  padding: 8px 14px;
  cursor: pointer;
  font-family: inherit;
}
.period-btn:active { opacity: 0.7; }

/* ============================================================
   管理者キー入力画面
   ============================================================ */
.admin-key-box {
  width: 100%;
  max-width: 360px;
  text-align: center;
}
.admin-key-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 4px;
  color: var(--accent);
  margin-bottom: 8px;
}
.admin-key-subtitle {
  font-size: 14px;
  color: var(--text2);
  margin-bottom: 32px;
}
.admin-key-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 18px;
  padding: 14px 16px;
  font-family: inherit;
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 16px;
}
.admin-key-input:focus { outline: none; border-color: var(--accent); }
.admin-key-error {
  background: #3b0a0a;
  border: 1px solid var(--danger);
  border-radius: var(--radius-sm);
  color: #fca5a5;
  padding: 10px 14px;
  font-size: 14px;
  margin-bottom: 16px;
  text-align: center;
}

/* ============================================================
   ドライバー選択モーダル
   ============================================================ */
.driver-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.driver-item:active { opacity: 0.75; }
.driver-item.selected { border-color: var(--accent); }
.driver-item-name { font-size: 16px; font-weight: 700; }
.driver-item-id   { font-size: 12px; color: var(--text3); }
.driver-url-btn   {
  font-size: 12px;
  color: var(--text3);
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}

/* ============================================================
   タイムピッカーモーダル
   ============================================================ */
.time-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 64px;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 2px;
  padding: 12px 16px;
  text-align: center;
}
.time-input:focus { outline: none; border-color: var(--accent); }

/* ============================================================
   アルコールチェックモーダル
   ============================================================ */
.alc-section { margin-bottom: 20px; }
.alc-section-label { font-size: 13px; color: var(--text2); margin-bottom: 8px; }

/* ============================================================
   日報フォーム
   ============================================================ */
.rf-section {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.rf-list-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.rf-list-item:last-child { margin-bottom: 0; }
.rf-list-idx { font-size: 13px; color: var(--text3); width: 20px; flex-shrink: 0; }
.rf-del-btn {
  font-size: 13px;
  color: var(--danger);
  background: none;
  border: 1px solid rgba(239,68,68,0.4);
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}
.rf-add-btn {
  font-size: 14px;
  color: var(--accent);
  background: none;
  border: 1px solid rgba(251,146,60,0.4);
  border-radius: var(--radius-sm);
  padding: 8px 16px;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
  margin-top: 8px;
}

/* ============================================================
   月次集計
   ============================================================ */
.monthly-summary {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.monthly-item-label { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
.monthly-item-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1px;
}
.monthly-item-value.normal  { color: var(--text); }
.monthly-item-value.over    { color: var(--overtime); }
.monthly-item-value.night   { color: var(--night); }
.monthly-item-value.holiday { color: var(--holiday); }

/* ============================================================
   空状態
   ============================================================ */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
  font-size: 15px;
}

/* ============================================================
   ユーティリティ
   ============================================================ */
.mt-8  { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8  { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.text-center { text-align: center; }
.text-2 { color: var(--text2); }
.text-3 { color: var(--text3); }
.text-accent  { color: var(--accent); }
.text-success { color: var(--success); }
.text-danger  { color: var(--danger); }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  </style>
</head>
<body>

<!-- ============================================================
     共通UI
     ============================================================ -->
<div id="toast"></div>

<div id="confirm-overlay">
  <div id="confirm-sheet">
    <div id="confirm-title"></div>
    <div id="confirm-body"></div>
    <button id="confirm-ok" class="confirm-btn danger">実行</button>
    <button class="confirm-btn ghost" onclick="closeConfirm()">キャンセル</button>
  </div>
</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-msg">読み込み中...</div>
</div>

<!-- ============================================================
     管理者キー入力画面
     （セキュリティ修正：URL パラメータ → フォーム POST に変更）
     ============================================================ -->
<div id="screen-admin-key" class="screen-fullpage">
  <div class="admin-key-box">
    <div class="admin-key-title">DRIVER MGMT</div>
    <div class="admin-key-subtitle">管理者キーを入力してください</div>
    <div id="admin-key-error" class="admin-key-error" style="display:none;"></div>

<!-- ============================================================
     JavaScript
     ============================================================ -->
<script>
'use strict';

// ============================================================
// 定数・設定
// ============================================================
const STORAGE_KEY    = 'driver_attendance_v2';
const DRIVERS_KEY    = 'driver_list_v1';
const CUR_DRIVER_KEY = 'current_driver_v1';
const CHECKERS_KEY   = 'checker_list_v1';
const DAY_NAMES      = ['日','月','火','水','木','金','土'];
const CACHE_TTL_MS   = 5 * 60 * 1000; // 5分

// ============================================================
// アプリ状態
// ============================================================
let appData         = {};   // { [driverId]: { [dateKey]: recordObj } }
let drivers         = [];
let currentDriverId = '';
let _checkerCache   = null;
let _loadedPeriods  = {};   // { "driverId_from_to": timestamp }

// モードフラグ
let _adminMode     = false;
let _dedicatedMode = false; // ドライバー専用URLモード

// URLパラメータ
const _urlParams   = new URLSearchParams(window.location.search);
const _urlDriverId = _urlParams.get('driver');
const _urlMode     = _urlParams.get('mode');
// セキュリティ修正：管理者キーは URL に含めず、フォームから POST で送信する

// ============================================================
// localStorage フォールバック付きストレージ
// ============================================================
const _mem = {};
const _store = {
  getItem(k)    { try { return localStorage.getItem(k); }    catch(e) { return _mem[k] ?? null; } },
  setItem(k, v) { try { localStorage.setItem(k, v); }        catch(e) { _mem[k] = v; } },
  removeItem(k) { try { localStorage.removeItem(k); }        catch(e) { delete _mem[k]; } },
  clear()       { try { localStorage.clear(); }              catch(e) { Object.keys(_mem).forEach(k => delete _mem[k]); } }
};

// ============================================================
// GAS / モックAPI 通信
// ============================================================
function fetchWithTimeout(url, options, ms) {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

// GET型リクエスト（実GAS用。モックサーバーにはPOSTを使う）
async function gasGet(params) {
  const url = CONFIG.GAS_URL + '?' + new URLSearchParams(params).toString();
  const res  = await fetchWithTimeout(url, {}, 15000);
  return res.json();
}

// POST型リクエスト（モックサーバー・実GAS共通）
async function gasPost(data) {
  const res  = await fetchWithTimeout(CONFIG.GAS_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(data)
  }, 15000);
  const json = await res.json();
  if (json && json.error) throw new Error(json.error);
  return json;
}

// ============================================================
// 画面遷移
// ============================================================
let _currentScreen = 'screen-punch';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  _currentScreen = id;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.screen === id);
  });
  window.scrollTo(0, 0);
}

function navTo(id) {
  showScreen(id);
  // 画面ごとの更新処理（Part 2〜4 で実装）
  if (id === 'screen-punch')    renderPunchScreen && renderPunchScreen();
  if (id === 'screen-records')  renderRecords     && renderRecords();
  if (id === 'screen-monthly')  renderMonthly     && renderMonthly();
  if (id === 'screen-report')   renderReportForm  && renderReportForm();
  if (id === 'screen-horeport') renderHoReport    && renderHoReport();
  if (id === 'screen-drivers')  renderDrivers     && renderDrivers();
}

// ============================================================
// トースト通知
// ============================================================
let _toastTimer = null;
function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  if (_toastTimer) clearTimeout(_toastTimer);
  el.textContent = msg;
  el.className   = 'show' + (isError ? ' error' : '');
  _toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ============================================================
// 確認ダイアログ
// ============================================================
function openConfirm(title, body, onOk, okLabel = '実行', isDestructive = true) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent  = body;
  const btn = document.getElementById('confirm-ok');
  btn.textContent = okLabel;
  btn.className   = 'confirm-btn ' + (isDestructive ? 'danger' : 'primary');
  document.getElementById('confirm-overlay').classList.add('open');
  btn.onclick = () => { closeConfirm(); onOk(); };
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
}

// ============================================================
// ローディング
// ============================================================
function showLoading(msg = '処理中...') {
  document.getElementById('loading-msg').textContent = msg;
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.remove('show');
}

// ============================================================
// ナビゲーション表示制御
// ============================================================
function updateNavVisibility() {
  document.getElementById('nav-monthly').style.display =
    _adminMode ? 'flex' : 'none';
  document.getElementById('nav-drivers').style.display =
    (_adminMode && !_dedicatedMode) ? 'flex' : 'none';
}

// ============================================================
// ドライバー関連
// ============================================================
function getDriverName(id) {
  const d = drivers.find(d => d.id === id);
  return d ? d.name : (id || '---');
}

function setCurrentDriver(id) {
  currentDriverId = id;
  try { _store.setItem(CUR_DRIVER_KEY, id); } catch(e) {}
  updateDriverBadges();
}

function updateDriverBadges() {
  const name = getDriverName(currentDriverId) || 'ドライバー選択';
  document.querySelectorAll('.driver-badge-name').forEach(el => {
    el.textContent = name;
  });
  // 専用モードはバッジをクリック不可に
  if (_dedicatedMode) {
    document.querySelectorAll('.driver-badge').forEach(btn => {
      btn.onclick = null;
      btn.style.cursor = 'default';
      const arrow = btn.querySelector('.driver-badge-arrow');
      if (arrow) arrow.style.display = 'none';
    });
  }
}

// ============================================================
// ドライバー選択モーダル
// ============================================================
function openDriverModal() {
  if (_dedicatedMode) return;
  const list = document.getElementById('driver-modal-list');
  list.innerHTML = drivers.map(d => `
    <div class="driver-item ${d.id === currentDriverId ? 'selected' : ''}"
         onclick="selectDriver('${d.id}')">
      <div>
        <div class="driver-item-name">${d.name}</div>
        <div class="driver-item-id">${d.id}</div>
      </div>
    </div>
  `).join('') || '<div class="empty-state">ドライバーが登録されていません</div>';
  document.getElementById('driver-modal').classList.add('open');
}
function closeDriverModal() {
  document.getElementById('driver-modal').classList.remove('open');
}
function selectDriver(id) {
  setCurrentDriver(id);
  closeDriverModal();
  // 現在の画面を更新
  navTo(_currentScreen);
}

// ============================================================
// キャッシュ管理
// ============================================================
function _saveDriversCache(list) {
  try { _store.setItem(DRIVERS_KEY, JSON.stringify({ data: list, ts: Date.now() })); } catch(e) {}
}
function _loadDriversCache() {
  try {
    const raw = _store.getItem(DRIVERS_KEY);
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    return (Date.now() - ts < CACHE_TTL_MS) ? data : null;
  } catch(e) { return null; }
}
function _saveCheckerCache(list) {
  try { _store.setItem(CHECKERS_KEY, JSON.stringify(list)); } catch(e) {}
}
function _loadCheckerCache() {
  try {
    const raw = _store.getItem(CHECKERS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

// ============================================================
// GAS データロード
// ============================================================
async function loadInitFromGAS() {
  try {
    const res = await gasPost({ action: 'getInit' });
    if (res.drivers)  { drivers = res.drivers;  _saveDriversCache(drivers); }
    if (res.checkers) { _checkerCache = res.checkers; _saveCheckerCache(res.checkers); }
  } catch(e) {
    console.error('Init error:', e);
  }
}

async function loadRecordsFromGAS(from, to, forceReload = false) {
  const key = `${currentDriverId}_${from}_${to}`;
  const now  = Date.now();
  if (!forceReload && _loadedPeriods[key] && now - _loadedPeriods[key] < CACHE_TTL_MS) return;

  try {
    const res = await gasPost({
      action:   'getRecords',
      driverId: currentDriverId,
      from, to
    });
    if (res.records) {
      res.records.forEach(r => {
        if (!appData[r.driverId]) appData[r.driverId] = {};
        appData[r.driverId][r.date] = r;
      });
    }
    _loadedPeriods[key] = now;
  } catch(e) {
    console.error('Records load error:', e);
    throw e;
  }
}

async function loadRecentRecordsFromGAS(limit = 10, forceReload = false) {
  try {
    const res = await gasPost({
      action:   'getRecentRecords',
      driverId: currentDriverId,
      limit
    });
    if (res.records) {
      res.records.forEach(r => {
        if (!appData[r.driverId]) appData[r.driverId] = {};
        appData[r.driverId][r.date] = r;
      });
    }
  } catch(e) {
    console.error('Recent records load error:', e);
    throw e;
  }
}

// ============================================================
// 日付ユーティリティ
// ============================================================
function dateKey(d) {
  if (!d) return '';
  const jst = new Date(d.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  return jst.toISOString().split('T')[0];
}
function todayKey()     { return dateKey(new Date()); }
function parseHHMM(s)   {
  if (!s) return null;
  const [h, m] = s.split(':').map(Number);
  return isNaN(h) || isNaN(m) ? null : h * 60 + m;
}
function minutesToHM(m) {
  if (m == null || isNaN(m)) return '---';
  const h = Math.floor(m / 60);
  const mm = String(m % 60).padStart(2, '0');
  return `${h}:${mm}`;
}
function formatDateLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}（${DAY_NAMES[d.getDay()]}）`;
}

// 締め期間計算（26日〜翌25日）
function getPeriod(offset = 0) {
  const now   = new Date();
  const year  = now.getFullYear();
  const month = now.getMonth(); // 0-indexed
  const day   = now.getDate();

  // 当月25日を過ぎていれば今月26〜来月25、それ以前なら先月26〜今月25
  let endMonth = day > 25 ? month + 1 : month;
  let endYear  = year;
  endMonth += offset;
  if (endMonth < 0) { endMonth += 12; endYear--; }
  if (endMonth > 11){ endMonth -= 12; endYear++; }

  const end   = new Date(endYear, endMonth, 25);
  const start = new Date(endYear, endMonth - 1, 26);

  const label = `${start.getMonth()+1}/${start.getDate()} 〜 ${end.getMonth()+1}/${end.getDate()}`;
  return { start, end, label };
}

// ============================================================
// 管理者キー入力
// ============================================================
async function submitAdminKey() {
  const input = document.getElementById('admin-key-input');
  const key   = input.value.trim();
  const errEl = document.getElementById('admin-key-error');
  errEl.style.display = 'none';

  if (!key) { errEl.textContent = 'キーを入力してください'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('admin-key-submit');
  btn.disabled = true;

  try {
    showLoading('確認中...');
    // セキュリティ修正：キーはPOSTボディで送信（URLに含めない）
    const res = await gasPost({ action: 'verifyAdminKey', key });
    hideLoading();
    if (res.success) {
      _adminMode = true;
      document.getElementById('screen-admin-key').classList.remove('active');
      await startApp();
    } else {
      errEl.textContent   = '管理者キーが正しくありません';
      errEl.style.display = 'block';
      input.value         = '';
    }
  } catch(err) {
    hideLoading();
    errEl.textContent   = '通信エラーが発生しました';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

// ============================================================
// アプリ起動
// ============================================================
async function startApp() {
  showLoading('読み込み中...');

  // キャッシュ読み込み
  const cachedDrivers  = _loadDriversCache();
  const cachedCheckers = _loadCheckerCache();
  if (cachedDrivers)  drivers       = cachedDrivers;
  if (cachedCheckers) _checkerCache = cachedCheckers;

  // GASから最新データを取得
  await loadInitFromGAS();

  hideLoading();

  // ドライバー設定
  if (_urlDriverId) {
    _dedicatedMode = true;
    if (!drivers.find(d => d.id === _urlDriverId)) {
      drivers.push({ id: _urlDriverId, name: '---' });
    }
    setCurrentDriver(_urlDriverId);
  } else {
    const saved = _store.getItem(CUR_DRIVER_KEY);
    if (saved && drivers.find(d => d.id === saved)) setCurrentDriver(saved);
    else if (drivers.length > 0) setCurrentDriver(drivers[0].id);
  }

  updateNavVisibility();
  updateDriverBadges();

  // 打刻画面を表示
  showScreen('screen-punch');
  // 各画面の初期描画（後のパートで実装）
  if (typeof renderPunchScreen === 'function') renderPunchScreen();
}

// ============================================================
// 初期化
// ============================================================
async function init() {
  if (_urlMode === 'admin') {
    // 管理者モード：キー入力画面を表示
    document.getElementById('screen-admin-key').classList.add('active');
    return;
  }
  await startApp();
}

init();
</script>
