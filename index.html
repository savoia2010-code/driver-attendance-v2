<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ドライバー勤怠管理</title>
  <!-- 機密情報は config.js から読み込む（.gitignore 済み） -->
  <script src="config.js"></script>
  <style>
    /* ============================================================
       リセット・基本設定
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --surface2:  #334155;
      --border:    #475569;
      --text:      #f1f5f9;
      --text2:     #94a3b8;
      --accent:    #3b82f6;
      --accent-dk: #1d4ed8;
      --success:   #16a34a;
      --danger:    #dc2626;
      --warning:   #d97706;
      --radius:    12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ============================================================
       画面切り替え
       ============================================================ */
    .screen { display: none; flex-direction: column; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ============================================================
       共通: ヘッダー
       ============================================================ */
    .page-header {
      background: var(--surface);
      padding: 24px 20px 18px;
      border-bottom: 2px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .page-header h1 {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .page-header p {
      font-size: 16px;
      color: var(--text2);
      margin-top: 4px;
    }

    /* ============================================================
       共通: コンテンツエリア
       ============================================================ */
    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ============================================================
       共通: フッター
       ============================================================ */
    .page-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      text-align: center;
    }

    /* ============================================================
       共通: ボタン
       ============================================================ */
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border: none;
      border-radius: var(--radius);
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      min-height: 52px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary   { background: var(--accent);   color: #fff; width: 100%; }
    .btn-secondary { background: var(--surface2); color: var(--text); width: 100%; }
    .btn-danger    { background: var(--danger);   color: #fff; width: 100%; }
    .btn-ghost     { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    .btn:disabled  { opacity: 0.4; cursor: not-allowed; }

    /* ============================================================
       共通: トースト通知
       ============================================================ */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      color: var(--text);
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 16px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 500;
      border: 1px solid var(--border);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error { background: #7f1d1d; border-color: var(--danger); }

    /* ============================================================
       共通: 確認モーダル
       ============================================================ */
    #confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #confirm-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    #confirm-sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 40px;
      width: 100%;
      transform: translateY(40px);
      transition: transform 0.25s;
    }
    #confirm-overlay.open #confirm-sheet {
      transform: translateY(0);
    }
    #confirm-title {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }
    #confirm-body {
      font-size: 16px;
      color: var(--text2);
      text-align: center;
      margin-bottom: 24px;
    }
    #confirm-ok   { margin-bottom: 12px; }

    /* ============================================================
       共通: ローディングオーバーレイ
       ============================================================ */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #loading-overlay.show { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { font-size: 18px; color: var(--text2); }

    /* ============================================================
       画面1: ドライバー選択
       ============================================================ */
    .driver-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 20px 24px;
      margin-bottom: 14px;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 22px;
      font-weight: bold;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      min-height: 72px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .driver-btn:hover  { background: var(--accent-dk); border-color: var(--accent); }
    .driver-btn:active { transform: scale(0.97); background: var(--accent-dk); }

    .error-box {
      background: #450a0a;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 20px;
      color: #fca5a5;
      text-align: center;
      font-size: 18px;
    }
    .error-box small {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      color: #f87171;
    }
    .error-box .btn { margin-top: 16px; width: auto; }

    .loading-txt {
      text-align: center;
      padding: 48px 0;
      color: var(--text2);
      font-size: 18px;
    }

    /* ============================================================
       画面2: パスワード入力
       ============================================================ */
    .pw-driver-name {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 28px 0 6px;
    }
    .pw-subtitle {
      font-size: 16px;
      color: var(--text2);
      text-align: center;
      margin-bottom: 32px;
    }
    .pw-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 36px;
      margin-bottom: 28px;
    }
    .pw-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .pw-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
    }
    .pw-numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .pw-key {
      height: 76px;
      font-size: 30px;
      font-weight: bold;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s, transform 0.08s;
      user-select: none;
      -webkit-user-select: none;
    }
    .pw-key:active { transform: scale(0.91); background: var(--surface2); }
    .pw-key.sub    { font-size: 17px; color: var(--text2); }
    .pw-error {
      background: #450a0a;
      border: 1px solid var(--danger);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      color: #fca5a5;
      text-align: center;
      font-size: 18px;
      margin-bottom: 16px;
    }

    /* ============================================================
       画面3: メイン打刻
       ============================================================ */
    .main-header-name {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }
    .main-header-date {
      font-size: 15px;
      color: var(--text2);
      text-align: center;
      margin-top: 4px;
    }

    /* ステータスカード */
    .status-card {
      border-radius: var(--radius);
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 24px;
      border: 2px solid var(--border);
      background: var(--surface);
    }
    .status-card.working { background: #052e16; border-color: var(--success); }
    .status-card.done    { background: #0c1a35; border-color: var(--accent); }

    .status-badge {
      display: inline-block;
      padding: 6px 22px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .status-card.none    .status-badge { background: var(--surface2); color: var(--text2); }
    .status-card.working .status-badge { background: var(--success);  color: #fff; }
    .status-card.done    .status-badge { background: var(--accent);   color: #fff; }

    .status-times {
      font-size: 16px;
      color: var(--text2);
      line-height: 2.2;
    }
    .status-times strong { color: var(--text); font-size: 18px; }

    /* 打刻ボタン */
    .action-btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      min-height: 84px;
      font-size: 28px;
      margin-bottom: 14px;
      transition: opacity 0.15s, transform 0.1s;
      user-select: none;
      -webkit-user-select: none;
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.clock-in   { background: linear-gradient(135deg, #15803d, #22c55e); color: #fff; }
    .action-btn.clock-out  { background: linear-gradient(135deg, #b91c1c, #ef4444); color: #fff; }
    .action-btn.alco-check { background: linear-gradient(135deg, #1d4ed8, #60a5fa); color: #fff; }

    .done-msg {
      text-align: center;
      color: var(--text2);
      font-size: 18px;
      padding: 20px 0 8px;
    }

    /* アルコールチェック入力モーダル */
    #alco-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 310;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #alco-overlay.open { opacity: 1; pointer-events: auto; }
    #alco-sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 44px;
      width: 100%;
      transform: translateY(40px);
      transition: transform 0.25s;
    }
    #alco-overlay.open #alco-sheet { transform: translateY(0); }
    .alco-title {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
    }
    .alco-unit {
      text-align: center;
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 8px;
    }
    #alco-input {
      width: 100%;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 52px;
      font-weight: bold;
      text-align: center;
      padding: 16px;
      margin-bottom: 20px;
      font-family: inherit;
    }
    #alco-input:focus { outline: none; border-color: var(--accent); }

    /* ============================================================
       画面2〜5: 準備中プレースホルダー
       ============================================================ */
    .placeholder-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text2);
      font-size: 20px;
      padding: 40px;
      text-align: center;
    }
    .placeholder-box .back-btn {
      margin-top: 24px;
      padding: 14px 32px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ============================================================
     共通UI
     ============================================================ -->
<div id="toast"></div>

<div id="confirm-overlay">
  <div id="confirm-sheet">
    <div id="confirm-title"></div>
    <div id="confirm-body"></div>
    <button id="confirm-ok"     class="btn btn-danger">実行する</button>
    <button id="confirm-cancel" class="btn btn-secondary" onclick="closeConfirm()">キャンセル</button>
  </div>
</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-msg">読み込み中...</div>
</div>

<!-- アルコールチェック値入力モーダル -->
<div id="alco-overlay">
  <div id="alco-sheet">
    <div class="alco-title">アルコール検査値を入力</div>
    <div class="alco-unit">単位: mg/L（0.00 が正常）</div>
    <input id="alco-input" type="number" step="0.01" min="0" max="9.99"
           inputmode="decimal" placeholder="0.00">
    <button class="btn btn-primary" onclick="confirmAlcoCheck()" style="margin-bottom:12px;">
      記録する
    </button>
    <button class="btn btn-secondary" onclick="closeAlcoModal()">キャンセル</button>
  </div>
</div>

<!-- ============================================================
     画面1: ドライバー選択
     ============================================================ -->
<div id="screen-select" class="screen active">
  <div class="page-header">
    <h1>勤怠管理</h1>
    <p>ドライバーを選択してください</p>
  </div>
  <div class="content">
    <div id="driver-list">
      <div class="loading-txt">読み込み中...</div>
    </div>
  </div>
  <div class="page-footer">
    <button class="btn btn-ghost" onclick="goAdminLogin()" style="width:auto;font-size:16px;padding:12px 28px;">
      管理者
    </button>
  </div>
</div>

<!-- ============================================================
     画面2: パスワード入力
     ============================================================ -->
<div id="screen-password" class="screen">
  <div class="page-header">
    <h1>パスワード入力</h1>
  </div>
  <div class="content">
    <div id="pw-driver-name" class="pw-driver-name"></div>
    <div class="pw-subtitle">パスワードを入力してください</div>

    <!-- 入力済み桁数をドットで表示 -->
    <div id="pw-dots" class="pw-dots">
      <span style="color:var(--text2);font-size:16px;">未入力</span>
    </div>

    <!-- エラーメッセージ -->
    <div id="pw-error" class="pw-error" style="display:none;"></div>

    <!-- 数字パッド -->
    <div class="pw-numpad">
      <button class="pw-key" onclick="pwKey('1')">1</button>
      <button class="pw-key" onclick="pwKey('2')">2</button>
      <button class="pw-key" onclick="pwKey('3')">3</button>
      <button class="pw-key" onclick="pwKey('4')">4</button>
      <button class="pw-key" onclick="pwKey('5')">5</button>
      <button class="pw-key" onclick="pwKey('6')">6</button>
      <button class="pw-key" onclick="pwKey('7')">7</button>
      <button class="pw-key" onclick="pwKey('8')">8</button>
      <button class="pw-key" onclick="pwKey('9')">9</button>
      <button class="pw-key sub" onclick="pwClear()">クリア</button>
      <button class="pw-key" onclick="pwKey('0')">0</button>
      <button class="pw-key sub" onclick="pwBackspace()">&#9003;</button>
    </div>

    <button class="btn btn-primary" id="pw-submit" onclick="submitPassword()">
      ログイン
    </button>
  </div>
  <div class="page-footer">
    <button class="btn btn-ghost" style="width:auto;padding:12px 28px;" onclick="pwGoBack()">
      もどる
    </button>
  </div>
</div>

<!-- ============================================================
     画面3: メイン打刻
     ============================================================ -->
<div id="screen-main" class="screen">
  <div class="page-header">
    <div id="main-header-name" class="main-header-name"></div>
    <div id="main-header-date" class="main-header-date"></div>
  </div>
  <div class="content">

    <!-- ステータスカード -->
    <div id="main-status-card" class="status-card none">
      <div class="status-badge">読み込み中...</div>
    </div>

    <!-- 打刻ボタンエリア（状態に応じて切り替え） -->
    <div id="action-area"></div>

    <!-- 日報入力へ -->
    <button class="btn btn-secondary" onclick="goReport()" style="margin-top:8px;">
      日報入力
    </button>

  </div>
  <div class="page-footer">
    <button class="btn btn-ghost" style="width:auto;padding:12px 28px;font-size:16px;" onclick="logout()">
      ログアウト
    </button>
  </div>
</div>

<!-- ============================================================
     画面4: 日報入力（PHASE 2以降で実装）
     ============================================================ -->
<div id="screen-report" class="screen">
  <div class="page-header">
    <h1>日報入力</h1>
  </div>
  <div class="placeholder-box">
    <div>この画面は次のフェーズで実装します</div>
    <button class="back-btn" onclick="showScreen('screen-select')">もどる</button>
  </div>
</div>

<!-- ============================================================
     画面5: 管理者（PHASE 2以降で実装）
     ============================================================ -->
<div id="screen-admin" class="screen">
  <div class="page-header">
    <h1>管理者</h1>
  </div>
  <div class="placeholder-box">
    <div>この画面は次のフェーズで実装します</div>
    <button class="back-btn" onclick="showScreen('screen-select')">もどる</button>
  </div>
</div>

<!-- ============================================================
     JavaScript
     ============================================================ -->
<script>
// ============================================================
// アプリ状態
// ============================================================
const state = {
  drivers:       [],
  currentDriver: null,
  todayRecord:   null,
};

// ============================================================
// 画面遷移
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ============================================================
// トースト通知
// ============================================================
let _toastTimer = null;
function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  if (_toastTimer) clearTimeout(_toastTimer);
  el.textContent = msg;
  el.className   = 'show' + (isError ? ' error' : '');
  _toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ============================================================
// 確認モーダル
// ============================================================
function openConfirm(title, body, onOk) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent  = body;
  const overlay = document.getElementById('confirm-overlay');
  overlay.classList.add('open');
  const btn = document.getElementById('confirm-ok');
  btn.onclick = () => { closeConfirm(); onOk(); };
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
}

// ============================================================
// ローディング
// ============================================================
function showLoading(msg = '処理中...') {
  document.getElementById('loading-msg').textContent = msg;
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.remove('show');
}

// ============================================================
// GAS / モックAPI 通信
// ============================================================
async function gasPost(action, params = {}) {
  const res = await fetch(CONFIG.GAS_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ action, ...params })
  });
  if (!res.ok) throw new Error('通信エラー: ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// ============================================================
// 画面1: ドライバー選択
// ============================================================
async function loadDrivers() {
  const list = document.getElementById('driver-list');
  list.innerHTML = '<div class="loading-txt">読み込み中...</div>';

  try {
    const res    = await gasPost('getDrivers');
    state.drivers = res.drivers || [];

    if (state.drivers.length === 0) {
      list.innerHTML = '<div class="error-box">ドライバーが登録されていません</div>';
      return;
    }

    list.innerHTML = state.drivers.map(d =>
      `<button class="driver-btn" onclick="selectDriver('${d.id}')">
        ${d.name}
      </button>`
    ).join('');

  } catch (err) {
    list.innerHTML = `
      <div class="error-box">
        読み込みに失敗しました
        <small>${err.message}</small>
        <button class="btn btn-secondary" onclick="loadDrivers()" style="margin-top:16px;">
          再読み込み
        </button>
      </div>`;
  }
}

function selectDriver(driverId) {
  state.currentDriver = state.drivers.find(d => d.id === driverId) || null;
  if (!state.currentDriver) return;
  enterPasswordScreen();
}

function goAdminLogin() {
  showScreen('screen-admin');
}

// ============================================================
// 画面3: メイン打刻
// ============================================================
function enterMainScreen() {
  // ヘッダーにドライバー名と日付をセット
  document.getElementById('main-header-name').textContent = state.currentDriver.name;
  document.getElementById('main-header-date').textContent = formatDateJP(new Date());
  showScreen('screen-main');
  loadMainStatus();
}

async function loadMainStatus() {
  try {
    const res = await gasPost('getStatus', { driverId: state.currentDriver.id });
    state.todayRecord = res.record;
    renderMainScreen(res.status, res.record);
  } catch (err) {
    showToast('状態の取得に失敗しました', true);
  }
}

function renderMainScreen(status, record) {
  const card   = document.getElementById('main-status-card');
  const action = document.getElementById('action-area');

  // ステータスカードの色クラスを切り替え
  card.className = 'status-card ' + status;

  let badgeText = { none: '未打刻', working: '出勤中', done: '退勤済み' }[status] || '不明';
  let detailHTML = '';

  if (status === 'none') {
    detailHTML = '<div style="color:var(--text2);font-size:16px;margin-top:4px;">本日の出勤打刻がありません</div>';
  } else if (status === 'working' && record) {
    const alc = record.alcoholCheck;
    detailHTML = `<div class="status-times">
      出勤: <strong>${record.clockIn}</strong><br>
      ${alc
        ? `アルコール: <strong>${Number(alc.value).toFixed(2)} mg/L</strong>（${alc.result === 'pass' ? '正常' : '検知'}）`
        : 'アルコール: <strong style="color:var(--warning);">未記録</strong>'}
    </div>`;
  } else if (status === 'done' && record) {
    const alc = record.alcoholCheck;
    detailHTML = `<div class="status-times">
      出勤: <strong>${record.clockIn}</strong><br>
      退勤: <strong>${record.clockOut}</strong><br>
      ${alc
        ? `アルコール: <strong>${Number(alc.value).toFixed(2)} mg/L</strong>（${alc.result === 'pass' ? '正常' : '検知'}）`
        : ''}
    </div>`;
  }

  card.innerHTML = `<div class="status-badge">${badgeText}</div>${detailHTML}`;

  // アクションボタンを状態で切り替え
  if (status === 'none') {
    action.innerHTML = `
      <button class="action-btn clock-in" onclick="confirmClockIn()">出勤打刻</button>`;
  } else if (status === 'working') {
    action.innerHTML = `
      <button class="action-btn alco-check" onclick="openAlcoModal()">アルコールチェック</button>
      <button class="action-btn clock-out"  onclick="confirmClockOut()">退勤打刻</button>`;
  } else {
    action.innerHTML = `<div class="done-msg">本日の打刻は完了しています</div>`;
  }
}

function formatDateJP(d) {
  const week = ['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${week[d.getDay()]}）`;
}

// ── 出勤打刻 ──
function confirmClockIn() {
  openConfirm(
    '出勤打刻',
    '出勤を記録します。よろしいですか？',
    async () => {
      try {
        showLoading('打刻中...');
        await gasPost('clockIn', { driverId: state.currentDriver.id });
        hideLoading();
        showToast('出勤打刻しました');
        await loadMainStatus();
      } catch (err) {
        hideLoading();
        showToast(err.message, true);
      }
    }
  );
}

// ── 退勤打刻 ──
function confirmClockOut() {
  openConfirm(
    '退勤打刻',
    '退勤を記録します。よろしいですか？',
    async () => {
      try {
        showLoading('打刻中...');
        await gasPost('clockOut', { driverId: state.currentDriver.id });
        hideLoading();
        showToast('退勤打刻しました');
        await loadMainStatus();
      } catch (err) {
        hideLoading();
        showToast(err.message, true);
      }
    }
  );
}

// ── アルコールチェック ──
function openAlcoModal() {
  document.getElementById('alco-input').value = '';
  document.getElementById('alco-overlay').classList.add('open');
  setTimeout(() => document.getElementById('alco-input').focus(), 300);
}

function closeAlcoModal() {
  document.getElementById('alco-overlay').classList.remove('open');
}

function confirmAlcoCheck() {
  const raw = document.getElementById('alco-input').value.trim();
  if (raw === '') { showToast('検査値を入力してください', true); return; }
  const num = parseFloat(raw);
  if (isNaN(num) || num < 0) { showToast('正しい数値を入力してください', true); return; }

  closeAlcoModal();
  const label = num === 0
    ? `0.00 mg/L（正常）`
    : `${num.toFixed(2)} mg/L（検知あり）`;

  openConfirm(
    'アルコールチェック記録',
    `検査値: ${label}\nこの内容で記録しますか？`,
    async () => {
      try {
        showLoading('記録中...');
        await gasPost('alcoholCheck', { driverId: state.currentDriver.id, value: num });
        hideLoading();
        showToast('アルコールチェックを記録しました');
        await loadMainStatus();
      } catch (err) {
        hideLoading();
        showToast(err.message, true);
      }
    }
  );
}

// ── ログアウト ──
function logout() {
  state.currentDriver = null;
  state.todayRecord   = null;
  showScreen('screen-select');
}

// ── 日報入力へ ──
function goReport() {
  showScreen('screen-report');
}

// ============================================================
// 画面2: パスワード入力
// ============================================================
let _pwValue = '';
const PW_MAX  = 8; // 最大桁数

function enterPasswordScreen() {
  _pwValue = '';
  document.getElementById('pw-driver-name').textContent = state.currentDriver.name;
  document.getElementById('pw-error').style.display     = 'none';
  renderPwDots();
  showScreen('screen-password');
}

function renderPwDots() {
  const dots = document.getElementById('pw-dots');
  if (_pwValue.length === 0) {
    dots.innerHTML = '<span style="color:var(--text2);font-size:16px;">未入力</span>';
    return;
  }
  dots.innerHTML = Array.from({ length: _pwValue.length }, () =>
    '<div class="pw-dot filled"></div>'
  ).join('');
}

function pwKey(digit) {
  if (_pwValue.length >= PW_MAX) return;
  _pwValue += digit;
  document.getElementById('pw-error').style.display = 'none';
  renderPwDots();
}

function pwBackspace() {
  if (_pwValue.length === 0) return;
  _pwValue = _pwValue.slice(0, -1);
  renderPwDots();
}

function pwClear() {
  _pwValue = '';
  document.getElementById('pw-error').style.display = 'none';
  renderPwDots();
}

function showPwError(msg) {
  const el = document.getElementById('pw-error');
  el.textContent    = msg;
  el.style.display  = 'block';
}

async function submitPassword() {
  if (_pwValue.length === 0) {
    showPwError('パスワードを入力してください');
    return;
  }

  const btn = document.getElementById('pw-submit');
  btn.disabled = true;

  try {
    showLoading('確認中...');
    const res = await gasPost('verifyPassword', { password: _pwValue });
    hideLoading();

    if (res.success) {
      _pwValue = ''; // 認証後は即クリア
      enterMainScreen();
    } else {
      showPwError('パスワードが正しくありません');
      _pwValue = '';
      renderPwDots();
    }
  } catch (err) {
    hideLoading();
    showPwError('通信エラーが発生しました');
  } finally {
    btn.disabled = false;
  }
}

function pwGoBack() {
  _pwValue = '';
  showScreen('screen-select');
}

// ============================================================
// 初期化
// ============================================================
async function init() {
  await loadDrivers();
}

init();
</script>
